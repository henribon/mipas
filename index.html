<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mipas</title>
<script>
// Antes da primeira pintura: sem isto a página pisca clara até o main.tsx
// rodar, o que fica evidente agora que o padrão é o tema escuro. O main.tsx
// aplica o tema de novo (e também no body) logo em seguida.
try {
  document.documentElement.classList.toggle('dark', (localStorage.getItem('mipas-tema') || 'dark') === 'dark');
} catch (e) {
  document.documentElement.classList.add('dark');
}
</script>
<!-- Same host as supabaseUrl in src/theme.ts -->
<link rel="preconnect" href="https://jutrmafktwlabkyjlfmi.supabase.co" crossorigin>
<link rel="preconnect" href="https://tile.openstreetmap.org">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
